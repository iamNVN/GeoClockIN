<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
<style>
.pin,.shadow,.tree{transform-box:fill-box}
.pin{animation:bob 2.4s ease-in-out infinite}
.shadow{transform-origin:center;animation:shadow 2.4s ease-in-out infinite}
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud.slow{animation-duration:12s;animation-direction:alternate-reverse}
.tree{transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
.tree.alt{animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shadow{50%{opacity:.08;transform:scaleX(.7)}}
@keyframes drift{to{transform:translateX(16px)}}
@keyframes sway{50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
